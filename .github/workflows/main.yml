name: C++ Build and Documentation

on:
  push:
    branches:
      - feature/lab1-vector-set
  pull_request:
    branches:
      - feature/lab1-vector-set

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Compile Vector3D and Set
        run: |
          cd "PPOIS LAB/LAB1"
          g++ -std=c++17 -Wall -Wextra -pedantic main.cpp set.cpp "VECTOR 3D.cpp" -o lab1

      - name: Generate Doxygen documentation
        run: |
          cd "PPOIS LAB/LAB1"
          doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: Doxygen-Documentation
          path: PPOIS LAB/LAB1/documentation/html/
