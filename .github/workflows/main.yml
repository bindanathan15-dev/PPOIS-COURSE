name: C++ Build

on:
  push:
    branches:
      - feature/lab1-vector-set
  pull_request:
    branches:
      - feature/lab1-vector-set

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

     - name: Compile Vector3D and Set
        run: |
          cd "PPOIS LAB/LAB1"
          g++ -std=c++17 -Wall -Wextra -pedantic main.cpp set.cpp "VECTOR 3D.cpp" -o lab1

      - name: Build successful
        run: echo "Vector3D and Set compiled successfully!"
