name: C++ Build, Tests, Coverage and Documentation

on:
  push:
    branches:
      - feature/lab1-vector-set
  pull_request:
    branches:
      - feature/lab1-vector-set

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz cmake g++ gcovr

      - name: Build project and tests
        run: |
          cmake -S "PPOIS LAB/LAB1" -B build
          cmake --build build --parallel

      - name: Run GoogleTest
        run: |
          ctest --test-dir build --output-on-failure

      - name: Measure code coverage
        run: |
          gcovr \
            --root "PPOIS LAB/LAB1" \
            --object-directory build \
            --filter '.*(VECTOR 3D|set)\.cpp$' \
            --print-summary \
            --json-summary coverage-summary.json \
            --html-details coverage.html \
            --fail-under-line 90

          python3 - <<'PY'
          import json
          import math
          import os

          with open("coverage-summary.json") as f:
              data = json.load(f)

          percent = data["line_percent"]
          filled = round(percent / 5)
          bar = "🟩" * filled + "⬜" * (20 - filled)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("# 🟩 LINE COVERAGE\n\n")
              f.write(f"# {percent:.1f}%\n\n")
              f.write(f"### {bar}\n\n")
              f.write(f"Covered lines: {data['lines_covered']} / {data['lines']}\n")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coverage-Report
          path: coverage*

      - name: Generate Doxygen documentation
        run: |
          cd "PPOIS LAB/LAB1"
          doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: Doxygen-Documentation
          path: PPOIS LAB/LAB1/documentation/html/
