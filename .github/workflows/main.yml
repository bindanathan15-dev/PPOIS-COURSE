name: C++ Build, Tests, Coverage and Documentation

on:
  push:
    branches:
      - feature/lab1-vector-set
  pull_request:
    branches:
      - feature/lab1-vector-set

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz cmake g++ gcovr

      - name: Build project and tests
        run: |
          cmake -S "PPOIS LAB/LAB1" -B build
          cmake --build build --parallel

      - name: Run GoogleTest
        run: |
          ctest --test-dir build --output-on-failure

      - name: Measure code coverage
        run: |
          gcovr \
            --root "PPOIS LAB/LAB1" \
            --object-directory build \
            --filter '.*(VECTOR 3D|set)\.cpp$' \
            --print-summary \
            --fail-under-line 90

      - name: Generate Doxygen documentation
        run: |
          cd "PPOIS LAB/LAB1"
          doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: Doxygen-Documentation
          path: PPOIS LAB/LAB1/documentation/html/
