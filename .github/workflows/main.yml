name: C++ Build, Tests and Documentation

on:
  push:
    branches:
      - feature/lab1-vector-set
  pull_request:
    branches:
      - feature/lab1-vector-set

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz cmake g++

     - name: Build project and tests
  run: |
    pwd
    ls -la
    find . -name CMakeLists.txt
    cmake -S "PPOIS LAB/LAB1" -B build
    cmake --build build --parallel
      - name: Run GoogleTest
        run: |
          cd "PPOIS LAB/LAB1"
          ctest --test-dir build --output-on-failure

      - name: Generate Doxygen documentation
        run: |
          cd "PPOIS LAB/LAB1"
          doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: Doxygen-Documentation
          path: PPOIS LAB/LAB1/documentation/html/
