name: C++ Build, Tests, Coverage and Documentation

on:
  push:
    branches:
      - feature/lab1-vector-set
  pull_request:
    branches:
      - feature/lab1-vector-set

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz cmake g++ gcovr

      - name: Build project and tests
        run: |
          cmake -S "PPOIS LAB/LAB1" -B build
          cmake --build build --parallel

      - name: Run GoogleTest
        run: |
          ctest --test-dir build --output-on-failure

      - name: Measure code coverage
        run: |
          gcovr \
            --root "PPOIS LAB/LAB1" \
            --object-directory build \
            --filter '.*(VECTOR 3D|set)\.cpp$' \
            --print-summary \
            --json-summary coverage-summary.json \
            --html-details coverage.html

          python3 - <<'PY'
          import json
          import os
          import sys

          with open("coverage-summary.json") as file:
              data = json.load(file)

          percent = data["line_percent"]
          total = data["lines"]
          covered = round(total * percent / 100)

          filled = max(0, min(20, round(percent / 5)))
          bar = "🟩" * filled + "⬜" * (20 - filled)

          if percent >= 90:
              status = "🟢 COVERAGE PASSED"
          else:
              status = "🔴 COVERAGE BELOW 90%"

          summary = f"""
          # {status}

          # 🟩 LINE COVERAGE

          # {percent:.1f}%

          ### {bar}

          Covered lines: {covered} / {total}

          Required coverage: 90%
          """

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write(summary)

          print(summary)

          if percent < 90:
              sys.exit(1)
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coverage-Report
          path: |
            coverage*
            coverage-summary.json
          if-no-files-found: warn

      - name: Generate Doxygen documentation
        run: |
          cd "PPOIS LAB/LAB1"
          doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: Doxygen-Documentation
          path: PPOIS LAB/LAB1/documentation/html/
